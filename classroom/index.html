<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<title>恩緹老師的教室 by NNX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed canvas sea; glass HUD pills float on top like a cozy diving game; divers swim in a grid "reef" in the middle */
:root{
  --sea-top:#86A6AB; --sea-mid:#9DBDBE; --sand:#DCD1BE; --sand-dk:#C7B9A1;
  --ink:#3B4A4E; --ink-soft:#6B7A7D;
  --glass:#F5F1EBE6; --glass-solid:#F5F1EB; --line:#3B4A4E1F;
  --accent:#C0968A; --gold:#CBAF77; --gold-dk:#A88C55; --sage:#9DAE97; --ok:#8FA98B;
  --coral:#BF958E; --fish:#D2B979; --skin:#EBCDB4; --lens:#D6E6E6;
  --ray:#FFFFFF; --veil:#2F3E42B3;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Fredoka","Huninn",ui-rounded,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sea-top:#2C3F45; --sea-mid:#3A5257; --sand:#6B6457; --sand-dk:#585246;
  --ink:#EEE8E0; --ink-soft:#B5BDB9; --glass:#2A373BE6; --glass-solid:#2A373B; --line:#EEE8E022;
  --accent:#D1A79B; --gold:#D6BC85; --gold-dk:#B79C63; --sage:#A6B6A0; --ok:#9DB699;
  --coral:#A9837C; --fish:#BFA86F; --skin:#DDBFA6; --lens:#9FB8BA; --ray:#CFE3E3; --veil:#111A1DCC;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --sea-top:#2C3F45; --sea-mid:#3A5257; --sand:#6B6457; --sand-dk:#585246;
  --ink:#EEE8E0; --ink-soft:#B5BDB9; --glass:#2A373BE6; --glass-solid:#2A373B; --line:#EEE8E022;
  --accent:#D1A79B; --gold:#D6BC85; --gold-dk:#B79C63; --sage:#A6B6A0; --ok:#9DB699;
  --coral:#A9837C; --fish:#BFA86F; --skin:#DDBFA6; --lens:#9FB8BA; --ray:#CFE3E3; --veil:#111A1DCC;
  color-scheme:dark}
/* 宇宙主題：固定一種夜空樣子（不跟著深淺色切換），面板維持奶油色好閱讀 */
html:root[data-world="space"]{
  --sea-top:#24283C; --sea-mid:#413E58; --sand:#8E8798; --sand-dk:#6E677E;
  --ink:#3A3E51; --ink-soft:#6A6C7C; --glass:#F3EEF0E8; --glass-solid:#F3EEF0; --line:#3A3E511F;
  --accent:#B8918F; --gold:#D2B97F; --gold-dk:#A0854F; --sage:#9FB1AA; --ok:#8BA596;
  --coral:#C29A9C; --fish:#D8C38E; --skin:#EBCDB4; --lens:#3E4766; --ray:#EDE6F2; --veil:#121420A6;
  color-scheme:light}
html[data-world="space"] .calm .bub{background:radial-gradient(circle at 35% 30%,#F6EAF0AA,#C9A9B588 40%,#8C7FA6AA 72%,#E9E1F033);box-shadow:inset -18px -18px 40px #2A2C4466,0 0 70px #D8C38E44}
html[data-world="space"] .pop{border-color:var(--fish);background:var(--fish);border-radius:3px}
.seg{display:flex;gap:6px;background:var(--glass);padding:4px;border-radius:999px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 16px;font-family:var(--f-display);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--glass-solid)}
html,body{min-height:100%}
body{background:var(--sea-mid);color:var(--ink);font-family:var(--f-body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;overflow-x:hidden}
#sea{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.app{position:relative;z-index:1;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pill{background:var(--glass);border-radius:999px;box-shadow:0 6px 18px #2B3A3E22;display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border:0;backdrop-filter:blur(6px)}
.hud{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hud-l,.hud-r{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.hud-r{align-items:flex-end}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.clock{font-family:var(--f-num);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;padding:8px 20px}
.clock svg{width:24px;height:24px;color:var(--gold)}
.loc{font-family:var(--f-display);font-size:21px;padding:12px 20px}
.loc svg{width:20px;height:20px}
.loc .sub{font-size:14px;color:var(--ink-soft);font-family:var(--f-body)}
.coins{font-family:var(--f-num);font-size:26px;font-weight:600;padding:8px 22px 8px 10px;font-variant-numeric:tabular-nums}
.coins small{font-family:var(--f-display);font-size:15px;color:var(--ink-soft);font-weight:400}
.coin{width:38px;height:38px;flex:none}
.minimap{width:118px;height:118px;border-radius:50%;background:var(--glass);box-shadow:0 0 0 5px var(--glass-solid),0 8px 20px #2B3A3E33;border:0;padding:0;position:relative}
.minimap svg{width:100%;height:100%}
.minimap .lbl{position:absolute;bottom:-26px;left:0;right:0;text-align:center;font-size:12px;color:var(--ink);font-family:var(--f-display);background:var(--glass);border-radius:999px;padding:2px 0}
.main{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.errands{background:var(--glass);border-radius:26px;padding:18px 18px 14px;box-shadow:0 8px 22px #2B3A3E22;display:flex;flex-direction:column;gap:10px;min-width:0}
.errands h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:13px;letter-spacing:.22em;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center;gap:8px}
.errands h2 b{display:block;color:var(--ink);font-size:20px;letter-spacing:.06em;font-weight:400;margin-top:2px}
.plus{width:40px;height:40px;border-radius:50%;border:0;background:var(--line);display:grid;place-items:center;flex:none}
.plus svg{width:20px;height:20px}
.task-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.allbtn{border:0;border-radius:999px;padding:7px 12px;background:var(--ok);color:var(--glass-solid);font-family:var(--f-display);font-size:14px;white-space:nowrap}
.allbtn.undo{background:var(--glass-solid);color:var(--ink-soft)}
.task .bar{grid-column:2/5!important}
.task{display:grid;grid-template-columns:44px 1fr auto auto;align-items:center;gap:10px;padding:8px 10px 8px 8px;border-radius:16px;background:var(--line)}
.task .ic{width:44px;height:44px;border-radius:14px;background:var(--glass-solid);display:grid;place-items:center;font-size:24px}
.task .tx{font-family:var(--f-display);font-size:17px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.task .ct{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink-soft)}
.task.all .ct{color:var(--ok)}
.task .bar{grid-column:2/4;height:5px;border-radius:5px;background:var(--glass-solid);overflow:hidden;margin-top:-2px}
.task .bar i{display:block;height:100%;background:var(--sage);border-radius:5px;transition:width .4s}
.hint{font-size:13px;color:var(--ink-soft);margin:2px 2px 0;line-height:1.5}
.reef{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 14px;padding-top:6px;min-width:0}
.diver{background:none;border:0;padding:6px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:24px;position:relative;animation:bob 5.5s ease-in-out infinite}
.diver:hover .avatar{transform:scale(1.05)}
.avatar{width:112px;height:112px;transition:transform .25s;filter:drop-shadow(0 10px 10px #2B3A3E2E)}
.avatar svg{width:100%;height:100%;overflow:visible}
.tag{background:var(--glass);border-radius:999px;padding:5px 14px 5px 8px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px #2B3A3E1F;max-width:100%}
.tag .sw{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.tag .nm{font-family:var(--f-display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tag .sc{font-family:var(--f-num);font-weight:600;font-size:15px;color:var(--gold-dk);display:flex;align-items:center;gap:3px;flex:none}
.tag .sc svg{width:17px;height:17px}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--glass-solid);background:#FFFFFF33;box-shadow:inset 0 0 0 1px var(--line)}
.dots i.on{background:var(--gold);border-color:var(--glass-solid)}
.crown{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--glass-solid);font-family:var(--f-display);font-size:13px;padding:2px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 10px #2B3A3E33}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -9px}}
.side{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;z-index:5}
.fab{width:62px;height:62px;border-radius:50%;border:0;background:var(--glass);box-shadow:0 8px 18px #2B3A3E33;display:grid;place-items:center;position:relative}
.fab svg{width:28px;height:28px}
.fab.big{width:78px;height:78px;background:var(--glass-solid)}
.fab span{position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);background:var(--glass-solid);font-family:var(--f-display);font-size:13px;padding:3px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 3px 8px #2B3A3E22}
.depth{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:5;font-family:var(--f-num);font-weight:600;font-size:22px;padding:12px 22px;font-variant-numeric:tabular-nums}
.depth small{font-family:var(--f-display);font-weight:400;font-size:14px;color:var(--ink-soft)}
/* sheets */
.scrim{position:fixed;inset:0;background:#2B3A3E59;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:0 max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
.sheet{background:var(--glass-solid);width:min(560px,100%);max-height:88%;overflow:auto;border-radius:28px 28px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px #2B3A3E33;display:flex;flex-direction:column;gap:14px;animation:up .28s ease-out}
.sheet.wide{width:min(760px,100%)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sh-head{display:flex;align-items:center;gap:14px}
.sh-head .avatar{width:84px;height:84px;flex:none}
.sh-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px;min-width:0;overflow-wrap:anywhere}
.sh-head p{margin:2px 0 0;color:var(--ink-soft);font-size:14px}
.x{margin-left:auto;width:44px;height:44px;border-radius:50%;border:0;background:var(--line);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.check{display:grid;grid-template-columns:52px 1fr 44px;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-radius:20px;padding:10px 12px 10px 10px;background:var(--line);min-height:68px;transition:background .2s}
.check .ic{width:52px;height:52px;border-radius:16px;background:var(--glass);display:grid;place-items:center;font-size:28px}
.check .tx{font-family:var(--f-display);font-size:21px;line-height:1.3}
.check .bx{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink-soft);display:grid;place-items:center}
.check .bx svg{width:22px;height:22px;opacity:0}
.check.done{background:color-mix(in srgb,var(--sage) 38%,transparent)}
.check.done .bx{background:var(--ok);border-color:var(--ok);color:var(--glass-solid)}
.check.done .bx svg{opacity:1}
.coinrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--line);border-radius:20px;padding:10px 12px}
.coinrow .v{font-family:var(--f-num);font-weight:600;font-size:30px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.coinrow .v svg{width:34px;height:34px}
.rbtn{width:52px;height:52px;border-radius:50%;border:0;background:var(--glass);font-family:var(--f-num);font-size:26px;font-weight:600;display:grid;place-items:center}
.btn{border:0;border-radius:999px;padding:12px 20px;background:var(--line);font-family:var(--f-display);font-size:16px}
.btn.pri{background:var(--accent);color:var(--glass-solid)}
.btn.warn{background:color-mix(in srgb,var(--accent) 25%,transparent)}
.btn.sm{padding:8px 14px;font-size:14px}
.tabs{display:flex;gap:6px;background:var(--line);padding:5px;border-radius:999px;align-self:flex-start;flex-wrap:wrap}
.tabs button{border:0;background:none;border-radius:999px;padding:8px 16px;font-family:var(--f-display);font-size:15px}
.tabs button[aria-selected="true"]{background:var(--glass-solid);box-shadow:0 2px 6px #2B3A3E22}
.ed-list{display:flex;flex-direction:column;gap:10px}
.ed-st{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;background:var(--line);border-radius:18px;padding:10px}
.ed-st .avatar{width:56px;height:56px}
.ed-st .f{display:flex;flex-direction:column;gap:8px;min-width:0}
input[type=text],input[type=time],select{font:inherit;font-size:16px;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0;width:100%}
.sws{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sws button{width:28px;height:28px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.sws button[aria-pressed="true"]{border-color:var(--ink)}
.lesson{background:var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px}
.lesson .top{display:grid;grid-template-columns:1fr 120px auto;gap:8px}
.trow{display:grid;grid-template-columns:70px 1fr 40px;gap:8px;align-items:center}
.trow select{padding:8px 4px;font-size:20px;text-align:center}
.del{width:40px;height:40px;border-radius:50%;border:0;background:var(--glass);display:grid;place-items:center}
.del svg{width:16px;height:16px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--line);border-radius:18px;padding:12px 14px;flex-wrap:wrap}
.opt b{font-family:var(--f-display);font-weight:400;font-size:16px}
.opt p{margin:2px 0 0;font-size:13px;color:var(--ink-soft)}
.sw-toggle{width:56px;height:32px;border-radius:999px;border:0;background:var(--ink-soft);position:relative;flex:none}
.sw-toggle::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--glass-solid);transition:left .2s}
.sw-toggle[aria-pressed="true"]{background:var(--ok)}
.sw-toggle[aria-pressed="true"]::after{left:28px}
.picker{display:flex;flex-direction:column;gap:8px}
.picker button{display:flex;justify-content:space-between;align-items:center;border:0;background:var(--line);border-radius:16px;padding:14px 16px;font-family:var(--f-display);font-size:18px;text-align:left;gap:10px}
.picker button[aria-current="true"]{background:color-mix(in srgb,var(--gold) 35%,transparent)}
.picker small{font-family:var(--f-num);color:var(--ink-soft);font-size:15px}
/* calm */
.calm{position:fixed;inset:0;z-index:30;background:var(--veil);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;color:#F3EEE7;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.calm .bub{width:min(56vmin,320px);aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFFFFF66,#B9D3D355 45%,#9DBDBE33 70%,#FFFFFF22);box-shadow:inset 0 0 40px #FFFFFF55,0 0 60px #CFE3E355;display:grid;place-items:center;transform:scale(.62);transition:transform 4s ease-in-out}
.calm .bub.in{transform:scale(1)}
.calm .word{font-family:var(--f-display);font-size:clamp(34px,7vmin,56px);letter-spacing:.1em}
.calm .t{font-family:var(--f-num);font-size:20px;opacity:.85;font-variant-numeric:tabular-nums}
.calm .row .btn{background:#F3EEE733;color:#F3EEE7}
.calm .row .btn[aria-pressed="true"]{background:#F3EEE7;color:#3B4A4E}
.float{position:fixed;z-index:40;pointer-events:none;font-family:var(--f-num);font-weight:600;font-size:28px;color:var(--gold-dk);text-shadow:0 2px 0 var(--glass-solid);animation:rise 1.2s ease-out forwards}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}
.pop{position:fixed;z-index:39;pointer-events:none;width:14px;height:14px;border-radius:50%;border:2px solid #FFFFFFCC;animation:pop 1s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) scale(1.6);opacity:0}}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:45;background:var(--glass-solid);padding:12px 22px;border-radius:999px;font-family:var(--f-display);font-size:18px;box-shadow:0 8px 20px #2B3A3E33;max-width:calc(100% - 32px);text-align:center}
.sync{font-size:12px;color:var(--ink-soft)}
.help ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;line-height:1.6;font-size:16px}
.floaters{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:10px;max-width:calc(100% - 32px)}
.fl{border:0;background:var(--glass-solid);border-radius:999px;padding:10px 18px;display:flex;align-items:center;gap:8px;font-family:var(--f-num);font-weight:600;font-size:24px;box-shadow:0 8px 18px #2B3A3E33;font-variant-numeric:tabular-nums;white-space:nowrap}
.fl svg{width:24px;height:24px}
.fl small{font-family:var(--f-display);font-size:13px;color:var(--ink-soft);font-weight:400}
.fl.lt span{font-family:var(--f-display);font-weight:400;font-size:19px}
.fl.warn{background:var(--gold);animation:pulse 1s infinite}
.fl.done{background:var(--accent);color:var(--glass-solid);animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.lamp{width:22px;height:22px;border-radius:50%;display:inline-block;box-shadow:inset -3px -4px 0 #0000001A,inset 3px 3px 0 #FFFFFF55}
.lamp.big{width:min(90px,20vw);height:min(90px,20vw);box-shadow:inset -8px -10px 0 #0000001A,inset 8px 8px 0 #FFFFFF55}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tools button{border:0;background:var(--line);border-radius:22px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.tools .tic{font-size:40px}.tools b{font-family:var(--f-display);font-weight:400;font-size:20px}.tools small{color:var(--ink-soft);font-size:13px;text-align:center}
.tm-wrap{position:relative;width:min(250px,68vw);aspect-ratio:1;margin:0 auto;max-width:100%}
.tm-ring{width:100%;height:100%}#tmRing{transition:stroke-dashoffset .25s linear}
.tm-big{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:clamp(48px,14vw,70px);font-variant-numeric:tabular-nums}
.row.center{justify-content:center}
.chip2{border:0;border-radius:999px;padding:9px 16px;background:var(--line);font-family:var(--f-display);font-size:16px}
.chip2[aria-pressed="true"]{background:var(--accent);color:var(--glass-solid)}
.btn.big{padding:14px 30px;font-size:19px}
.btn:disabled{opacity:.45;cursor:default}
.pick-stage{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:190px;justify-content:center}

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const COLORS=['#B98B82','#8FA6B5','#A3B18F','#C9AE7C','#9E92B0','#7FA39B','#C49B7A','#8E8A84'];
const ICONS=['📖','✏️','👂','🙋','🪑','🧹','🎒','📝','👀','🤫','🧩','🗣️','🔢','🎨','💧','⭐'];
const ic={x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
 coin:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="var(--gold)"/><path d="M20 9l2.6 8.4L31 20l-8.4 2.6L20 31l-2.6-8.4L9 20l8.4-2.6z" fill="var(--gold-dk)"/></svg>'};

const DEFAULT=()=>({
  students:[
    {id:'s1',name:'小鯨（範例）',color:COLORS[1]},
    {id:'s2',name:'小海龜（範例）',color:COLORS[2]},
    {id:'s3',name:'小章魚（範例）',color:COLORS[0]},
    {id:'s4',name:'小海星（範例）',color:COLORS[3]}],
  lessons:[1,2,3,4,5,6,7].map((n,i)=>({id:'l'+n,name:'第'+n+'節',time:['08:40','09:30','10:30','11:20','13:30','14:20','15:20'][i],
    tasks:[{id:uid(),icon:'📖',text:'拿出課本和鉛筆盒'},{id:uid(),icon:'👂',text:'坐好、眼睛看老師'},{id:uid(),icon:'✏️',text:'完成學習單'},{id:uid(),icon:'🧹',text:'收拾桌面'}]})),
  cur:null, auto:true, coins:{}, prog:{}, date:today(), voice:true});

let S=null, photos={}, db=null, ref=null, lastJSON='', writing=false, pending=false, syncMode='local';

function normalize(d){
  const s=Object.assign(DEFAULT(),d||{});
  s.students=Array.isArray(s.students)?s.students:[];
  s.lessons=Array.isArray(s.lessons)&&s.lessons.length?s.lessons:DEFAULT().lessons;
  s.coins=s.coins||{}; s.prog=s.prog||{}; s.dex=s.dex||{};
  return s;
}
function loadLocal(){try{const j=localStorage.getItem('entee-sea');if(j)return JSON.parse(j)}catch(e){}return null}
function loadLocalPhotos(){try{const j=localStorage.getItem('entee-sea-photos');if(j)return JSON.parse(j)}catch(e){}return {}}
function dayCheck(){ if(S.date!==today()){S.prog={};S.date=today();S.auto=true;return true} return false }
const WD=['日','一','二','三','四','五','六'];
const onToday=l=>!l.days||!l.days.length||l.days.includes(new Date().getDay());
function autoLesson(){
  if(!S.auto && S.lessons.find(l=>l.id===S.cur)) return;
  const now=new Date(), m=now.getHours()*60+now.getMinutes();
  const td=S.lessons.filter(onToday), list=td.filter(l=>l.time).sort((a,b)=>a.time.localeCompare(b.time));
  let pick=list[0]||td[0]||S.lessons[0];
  for(const l of list){const [h,mm]=l.time.split(':').map(Number); if(h*60+mm-10<=m) pick=l;}
  S.cur=pick.id;
}
const lesson=()=>S.lessons.find(l=>l.id===S.cur)||S.lessons[0];
const roster=L=>{L=L||lesson();return Array.isArray(L.members)?S.students.filter(s=>L.members.includes(s.id)):S.students};
function newStudent(){
  const ids=S.students.map(s=>s.id);
  S.lessons.forEach(l=>{if(!Array.isArray(l.members))l.members=ids.slice()});
  const s={id:uid(),name:'新同學',color:COLORS[S.students.length%COLORS.length]};
  S.students.push(s); lesson().members.push(s.id); save(); render(); return s;
}
function toggleMember(L,id){
  if(!Array.isArray(L.members))L.members=S.students.map(s=>s.id);
  L.members=L.members.includes(id)?L.members.filter(x=>x!==id):[...L.members,id];
}
const prog=(sid)=>{const L=lesson();S.prog[L.id]=S.prog[L.id]||{};return S.prog[L.id][sid]=S.prog[L.id][sid]||{d:[],b:false}};
const peek=(sid)=>{const L=lesson();return (S.prog[L.id]&&S.prog[L.id][sid])||{d:[],b:false}};

let recent=[];
function save(){
  lastJSON=JSON.stringify(S);
  recent.push(lastJSON); if(recent.length>12) recent.shift();
  try{localStorage.setItem('entee-sea',lastJSON)}catch(e){}
  clearTimeout(save.t); save.t=setTimeout(()=>{save.t=null;push()},450);
}
async function push(){
  if(!ref) return;
  if(writing){pending=true;return}
  writing=true;
  try{await ref.set(JSON.parse(lastJSON));syncMode='cloud'}catch(e){syncMode='local';if(e&&e.code==='not_granted')ref=null}
  writing=false; if(pending){pending=false;push()}
}

/* ---------- world (海底 / 宇宙) ---------- */
const world=()=>S&&S.theme==='space'?'space':'sea';
const W_TXT={sea:{unit:' m',lbl:'深',map:'尋寶',done:'找到寶藏！',allT:'全班都找到寶藏了！',allS:'全班所有任務都完成了，大家太棒了！'},
  space:{unit:' 光年',lbl:'遠',map:'探索',done:'抵達星球！',allT:'全班都抵達星球了！',allS:'全班所有任務都完成了，我們抵達星球了！'}};
const TX=()=>W_TXT[world()];
function astroSVG(st,size){
  const c=st.color||COLORS[0], ph=photos[st.id], cid='a'+st.id+(size||'');
  const visor=ph
    ? `<defs><clipPath id="${cid}"><ellipse cx="60" cy="64" rx="27" ry="24"/></clipPath></defs><image href="${ph}" x="33" y="38" width="54" height="54" clip-path="url(#${cid})" preserveAspectRatio="xMidYMid slice"/><ellipse cx="60" cy="64" rx="27" ry="24" fill="none" stroke="#3E4766" stroke-width="3"/>`
    : `<ellipse cx="60" cy="64" rx="27" ry="24" fill="var(--lens)"/><circle cx="50" cy="65" r="4.6" fill="#fff"/><circle cx="70" cy="65" r="4.6" fill="#fff"/><circle cx="51.5" cy="66" r="2" fill="#3E4766"/><circle cx="71.5" cy="66" r="2" fill="#3E4766"/><path d="M53 76 Q60 81 67 76" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 120 120">
  <ellipse cx="20" cy="94" rx="10" ry="7" fill="${c}" transform="rotate(-35 20 94)"/><ellipse cx="100" cy="94" rx="10" ry="7" fill="${c}" transform="rotate(35 100 94)"/>
  <rect x="34" y="86" width="52" height="32" rx="14" fill="${c}"/><rect x="50" y="102" width="20" height="10" rx="3" fill="#F4EFEA"/><circle cx="55" cy="107" r="2" fill="#B8918F"/><circle cx="64" cy="107" r="2" fill="#9FB1AA"/>
  <path d="M82 30 L93 11" stroke="${c}" stroke-width="4" stroke-linecap="round"/><circle cx="94" cy="9" r="5.5" fill="var(--gold)"/>
  <rect x="16" y="52" width="10" height="22" rx="5" fill="${c}"/><rect x="94" y="52" width="10" height="22" rx="5" fill="${c}"/>
  <circle cx="60" cy="62" r="38" fill="#F4EFEA" stroke="${c}" stroke-width="5"/>${visor}
  <path d="M41 54 Q44 46 52 43" stroke="#FFFFFFCC" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;
}

/* ---------- diver svg ---------- */
function diverSVG(st,size){
  if(world()==='space') return astroSVG(st,size);
  const c=st.color||COLORS[0], ph=photos[st.id], cid='c'+st.id+(size||'');
  const tube=`<path d="M92 40 C100 30 100 18 94 10" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round"/><rect x="88" y="4" width="11" height="9" rx="3" fill="var(--glass-solid)" stroke="${c}" stroke-width="2.5"/>`;
  const arms=`<ellipse cx="22" cy="92" rx="9" ry="6" fill="var(--skin)" transform="rotate(-30 22 92)"/><ellipse cx="98" cy="92" rx="9" ry="6" fill="var(--skin)" transform="rotate(30 98 92)"/>`;
  if(ph){
    return `<svg viewBox="0 0 120 120">${arms}${tube}<defs><clipPath id="${cid}"><circle cx="60" cy="62" r="36"/></clipPath></defs>

let twVoice=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices();
  twVoice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/Taiwan|台灣|國語|Mei-Jia|Hanhan|Yating|Zhiwei/i.test(v.name))||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,force){
  if(!(force||S.voice)||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';if(twVoice)u.voice=twVoice;u.rate=.95;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}
}

/* ---------- fx ---------- */
function fx(el,text){
  const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  if(text){const f=document.createElement('div');f.className='float';f.textContent=text;f.style.left=(cx-20)+'px';f.style.top=(cy-30)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1300)}
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  for(let i=0;i<9;i++){const b=document.createElement('div');b.className='pop';const s=6+Math.random()*12;b.style.width=b.style.height=s+'px';b.style.left=cx+'px';b.style.top=cy+'px';b.style.setProperty('--dx',(Math.random()*120-60)+'px');b.style.setProperty('--dy',(-40-Math.random()*90)+'px');document.body.appendChild(b);setTimeout(()=>b.remove(),1000)}
}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

let openSheet=null, renaming=null;

  const sh=document.createElement('div');sh.className='sheet'+(wide?' wide':'');sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');
  scrim.appendChild(sh);$('#layer').appendChild(scrim);
  scrim.addEventListener('click',e=>{if(e.target===scrim)close()});
  openSheet={el:sh,scrim,refresh:()=>build(sh)};build(sh);
  const f=sh.querySelector('button,input');if(f)f.focus({preventScroll:true});
}
function close(){if(openSheet){openSheet.scrim.remove();openSheet=null}}

    sh.querySelector('[data-alldone]').onclick=e=>{lesson().tasks.forEach(t=>{if(!peek(sid).d.includes(t.id))toggleTask(sid,t.id,e.target,true)});finishCheck(sid,e.target);save();render()};

function toggleTask(sid,tid,el,silent){
  const p=prog(sid), s=S.students.find(x=>x.id===sid), t=lesson().tasks.find(x=>x.id===tid);
  if(p.d.includes(tid)){p.d=p.d.filter(x=>x!==tid);S.coins[sid]=Math.max(0,(S.coins[sid]||0)-1)}
  else{p.d.push(tid);S.coins[sid]=(S.coins[sid]||0)+1;fx(el,'+1');
    if(!silent){ if(!finishCheck(sid,el)) say(s.name.replace(/（範例）/,'')+'完成了'+t.text+'，好棒！'); }}
  if(!silent){save();render()}
}
function finishCheck(sid,el){
  const L=lesson(), p=prog(sid), s=S.students.find(x=>x.id===sid);
  if(L.tasks.length&&!p.b&&L.tasks.every(t=>p.d.includes(t.id))){
    p.b=true;S.coins[sid]=(S.coins[sid]||0)+2;setTimeout(()=>fx(el,'+2 獎勵'),350);
    const g=grant(sid); setTimeout(()=>revealOne(sid,g),900);
    const {done,all}=totals(); if(all&&done===all) setTimeout(()=>toast(TX().allT),1600);
    return true;
  }
  return false;
}

let calmEl=null,calmTimers=[];
function calm(){
  close();
  calmEl=document.createElement('div');calmEl.className='calm';calmEl.setAttribute('role','dialog');calmEl.setAttribute('aria-label','上課靜心');
  let mins=1, guide=S.voice, left=60, phase=0;
  calmEl.innerHTML=`<div class="bub" id="bub"><span class="word" id="word">準備</span></div><div class="t" id="ct">1:00</div>
    <div class="row" id="mins">${[1,2,3].map(m=>`<button class="btn sm" data-m="${m}" aria-pressed="${m===1}">${m} 分鐘</button>`).join('')}<button class="btn sm" id="g" aria-pressed="${guide}">語音引導</button></div>
    <button class="btn pri" id="end">結束靜心</button>`;
  document.body.appendChild(calmEl);
  const bub=calmEl.querySelector('#bub'),word=calmEl.querySelector('#word'),ct=calmEl.querySelector('#ct');
  const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  const step=()=>{phase=1-phase;bub.classList.toggle('in',phase===1);word.textContent=phase?'吸氣':'吐氣';if(guide)say(phase?'吸氣':'吐氣',true)};
  const start=()=>{calmTimers.forEach(clearInterval);left=mins*60;ct.textContent=fmt(left);phase=0;step();
    calmTimers=[setInterval(step,4000),setInterval(()=>{left--;ct.textContent=fmt(Math.max(0,left));if(left<=0){endCalm();toast('靜心完成，我們準備好上課了');say('靜心完成，我們準備好上課了',true)}},1000)]};
  calmEl.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mins=+b.dataset.m;calmEl.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b));start()});
  calmEl.querySelector('#g').onclick=e=>{guide=!guide;e.target.setAttribute('aria-pressed',guide)};
  calmEl.querySelector('#end').onclick=endCalm;
  setTimeout(start,600);
}
function endCalm(){calmTimers.forEach(clearInterval);calmTimers=[];if(calmEl){calmEl.remove();calmEl=null}try{speechSynthesis.cancel()}catch(e){}}

  const L=lesson(), R=roster(L), t=L.tasks.find(x=>x.id===tid); if(!t||!R.length) return;
  if(R.every(s=>peek(s.id).d.includes(tid))){
    R.forEach(s=>{const p=prog(s.id);p.d=p.d.filter(x=>x!==tid);S.coins[s.id]=Math.max(0,(S.coins[s.id]||0)-1)});

  }else{

    const {done,all}=totals();

    else{toast('全班完成「'+t.text+'」'+(wins.length?'，'+wins.length+' 人獲得新夥伴':''));if(!wins.length)say('全班都完成了'+t.text+'，大家好棒！')}

/* ---------- 班級工具 ---------- */
const TM={total:180,left:180,endAt:0,running:false,done:false,iv:null};
const fmtT=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const tmLeft=()=>TM.running?(TM.endAt-Date.now())/1000:TM.left;
let actx=null;
function chime(){try{if(!actx)return;[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=actx.createOscillator(),gn=actx.createGain();o.type='sine';o.frequency.value=f;const t0=actx.currentTime+i*.25;gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(.28,t0+.03);gn.gain.exponentialRampToValueAtTime(.001,t0+1.2);o.connect(gn).connect(actx.destination);o.start(t0);o.stop(t0+1.3)})}catch(e){}}
function updRing(){const r=document.getElementById('tmRing');if(!r)return;const C=2*Math.PI*88,f=TM.total?Math.max(0,tmLeft())/TM.total:0;r.style.strokeDashoffset=C*(1-f);r.style.stroke=TM.running&&tmLeft()<=10?'var(--gold-dk)':'var(--accent)'}
function tmTick(){
  if(TM.running&&tmLeft()<=0){TM.running=false;TM.left=0;TM.done=true;clearInterval(TM.iv);chime();setTimeout(()=>say('時間到！',true),900);toast('時間到！');if(document.getElementById('tmBig')&&openSheet)openSheet.refresh()}
  renderFloat();const el=document.getElementById('tmBig');if(el){el.textContent=fmtT(tmLeft());updRing()}
}
function tmStart(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}
  if(TM.left<=0)TM.left=TM.total;TM.endAt=Date.now()+TM.left*1000;TM.running=true;TM.done=false;clearInterval(TM.iv);TM.iv=setInterval(tmTick,250);tmTick()}
function tmPause(){TM.left=tmLeft();TM.running=false;clearInterval(TM.iv);tmTick()}
function tmSet(sec){TM.total=sec;TM.left=sec;TM.done=false;if(TM.running)TM.endAt=Date.now()+sec*1000;tmTick()}
function tmAdd(d){if(TM.running){TM.endAt=Math.max(Date.now()+1000,TM.endAt+d*1000);TM.total=Math.max(TM.total,tmLeft())}else{TM.left=Math.max(0,TM.left+d);TM.total=Math.max(TM.total,TM.left,1)}TM.done=false;tmTick()}
function tmReset(){TM.running=false;clearInterval(TM.iv);TM.left=TM.total;TM.done=false;tmTick()}

const LIGHTS={r:['安靜','var(--accent)','現在請安靜'],y:['小聲說話','var(--gold)','請小聲說話'],g:['可以討論','var(--ok)','可以小聲討論了']};

  space:[['sp-star','⭐','小星星',0],['sp-moon','🌙','彎彎月亮',0],['sp-comet','☄️','流星',0],['sp-earth','🌍','地球',0],['sp-sun','🌞','太陽公公',0],['sp-rocket','🚀','小火箭',0],
       ['sp-saturn','🪐','土星',1],['sp-sat','🛰️','人造衛星',1],['sp-ufo','🛸','飛碟',1],['sp-shine','🌟','閃亮星',1],
       ['sp-alien','👽','外星朋友',2],['sp-galaxy','🌌','銀河',2]]};
const RAR=[['普通','var(--sage)'],['稀有','var(--accent)'],['傳說','var(--gold)']];
const dexList=()=>DEX[world()];
const own=sid=>{S.dex=S.dex||{};return S.dex[sid]=S.dex[sid]||{}};
const ownCount=sid=>dexList().filter(c=>S.dex&&S.dex[sid]&&S.dex[sid][c[0]]).length;
function grant(sid){
  const r=Math.random(), tier=r<.06?2:r<.32?1:0, o=own(sid);
  const pool=dexList().filter(c=>c[3]===tier), fresh=pool.filter(c=>!o[c[0]]);
  const from=fresh.length&&Math.random()<.7?fresh:pool, c=from[Math.floor(Math.random()*from.length)];
  o[c[0]]=(o[c[0]]||0)+1; return {c,n:o[c[0]]};
}
const nm=s=>s.name.replace(/（範例）/,'');
function revealOne(sid,g,bought){
  const s=S.students.find(x=>x.id===sid); if(!s) return; const [,em,cn,t]=g.c;
  sheet(sh=>{
    sh.innerHTML=head(g.n===1?'獲得新夥伴！':'又遇到老朋友！',esc(s.name)+(bought?' 用 5 個金幣抽卡':' 完成這節全部任務'))+
     `<div class="rv"><div class="rv-card" style="--r:${RAR[t][1]}"><span class="rv-em">${em}</span></div><div class="rv-nm">${esc(cn)}</div>
      <div class="row center"><span class="rar" style="--r:${RAR[t][1]}">${RAR[t][0]}</span><span class="lab">${g.n===1?'新收集！':'已經有 '+g.n+' 隻了'}</span></div>
      <div class="lab">圖鑑 ${ownCount(sid)} / ${dexList().length}</div></div>
      <div class="row center"><button class="btn pri big" id="rvOk">太棒了！</button><button class="btn big" id="rvDex">看圖鑑</button></div>`;
    sh.querySelector('[data-close]').onclick=close; sh.querySelector('#rvOk').onclick=close; sh.querySelector('#rvDex').onclick=()=>dexSheet(sid);
  });
  const c=document.querySelector('.rv-card'); if(c) setTimeout(()=>fx(c),300);
  say(bought?nm(s)+'抽到了'+cn+'！':nm(s)+'全部完成了！獲得'+cn+'！');
}
function revealMany(list){
  sheet(sh=>{
    sh.innerHTML=head('大家獲得新夥伴！',list.length+' 位完成全部任務')+`<div class="rv-grid">${list.map(({sid,g})=>{const s=S.students.find(x=>x.id===sid);if(!s)return'';const [,em,cn,t]=g.c;
      return `<div class="rv-mini" style="--r:${RAR[t][1]}"><span class="avatar">${diverSVG(s,'v')}</span><span class="rv-em sm">${em}</span><b>${esc(s.name)}</b><small>${esc(cn)}${g.n===1?' · 新！':''}</small></div>`}).join('')}</div>
      <div class="row center"><button class="btn pri big" id="rvOk">太棒了！</button></div>`;
    sh.querySelector('[data-close]').onclick=close; sh.querySelector('#rvOk').onclick=close;
  });
  say('有'+list.length+'位同學獲得新夥伴，大家好棒！');
}
let dexSid=null;
function dexSheet(sid){
  if(sid) dexSid=sid;
  sheet(sh=>{
    const R=roster().length?roster():S.students;
    if(!R.some(x=>x.id===dexSid)) dexSid=R[0]&&R[0].id;
    const s=S.students.find(x=>x.id===dexSid);
    const title=(world()==='space'?'太空':'海洋')+'圖鑑';
    if(!s){sh.innerHTML=head(title,'先新增學生');sh.querySelector('[data-close]').onclick=close;return}
    const o=(S.dex&&S.dex[s.id])||{}, L=dexList(), c=S.coins[s.id]||0;
    sh.innerHTML=head(title,esc(s.name)+' 收集了 '+ownCount(s.id)+' / '+L.length)+
     `<div class="row">${R.map(x=>`<button class="chip2" data-ds="${x.id}" aria-pressed="${x.id===s.id}">${esc(x.name)}</button>`).join('')}</div>
      <div class="dex">${L.map(([id,em,cn,t])=>{const n=o[id]||0;return `<div class="dx ${n?'':'no'}" style="--r:${RAR[t][1]}"><span class="dx-em">${em}</span><b>${n?esc(cn):'？？？'}</b><small>${RAR[t][0]}${n>1?' ×'+n:''}</small></div>`}).join('')}</div>
      <div class="coinrow"><span class="lab">用 5 個金幣抽一次</span><span class="v">${ic.coin}${c}</span><button class="btn pri" id="dxBuy" ${c<5?'disabled':''}>抽一張</button></div>
      <p class="hint">完成一節的全部任務會免費抽一隻。普通、稀有、傳說，看誰先收集完！</p>`;
    sh.querySelector('[data-close]').onclick=close;
    sh.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{dexSid=b.dataset.ds;openSheet.refresh()});
    sh.querySelector('#dxBuy').onclick=()=>{if((S.coins[s.id]||0)<5)return;S.coins[s.id]-=5;const g=grant(s.id);save();render();revealOne(s.id,g,true)};
  },true);
}
$('#toolBtn').onclick=toolsSheet;
$('#locBtn').onclick=lessonPicker;
$('#editTasks').onclick=()=>{scrollToCur=true;settings('lessons')};
$('#setBtn').onclick=()=>settings();
$('#helpBtn').onclick=help;
$('#calmBtn').onclick=calm;
$('#mapBtn').onclick=()=>{const {done,all}=totals();toast(all?`全班完成 ${done} / ${all} 個任務`:'先加學生和任務吧')};
function tick(){const d=new Date();$('#clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(S){const was=S.cur;if(dayCheck())save();autoLesson();if(was!==S.cur)render()}}

/* ---------- boot ---------- */
S=normalize(loadLocal());photos=loadLocalPhotos();dayCheck();render();tick();setInterval(tick,15000);
(async()=>{
  const c=window.claude; if(!c||!c.use)return;
  try{db=await c.use('db')}catch(e){db=null}
  if(!db)return;
  ref=db.doc('class/state');
  ref.onSnapshot(snap=>{
    if(snap.exists){const j=JSON.stringify(snap.data());syncMode='cloud';
      if(save.t||writing||pending||recent.includes(j)) return;
      if(j!==lastJSON){lastJSON=j;S=normalize(JSON.parse(j));if(dayCheck())save();try{localStorage.setItem('entee-sea',lastJSON)}catch(e){}render()}}
    else{save()}
  },()=>{syncMode='local'});
  db.collection('photos').onSnapshot(qs=>{const p={};qs.docs.forEach(d=>{const v=d.data();if(v&&v.src)p[d.id]=v.src});
    if(qs.docs.length||Object.keys(photos).length===0){photos=p;try{localStorage.setItem('entee-sea-photos',JSON.stringify(photos))}catch(e){}renderReef()}},()=>{});
})();

/* ---------- sea canvas ---------- */
const cv=$('#sea'),g=cv.getContext('2d');let W=0,H=0,col={},fish=[],bubs=[],corals=[],weeds=[],rocks=[];
const reduce=matchMedia('(prefers-reduced-motion:reduce)');
function readCol(){const cs=getComputedStyle(document.documentElement);['sea-top','sea-mid','sand','sand-dk','coral','fish','sage','ray','accent'].forEach(k=>col[k]=cs.getPropertyValue('--'+k).trim())}
function rnd(a,b){return a+Math.random()*(b-a)}
function scene(){
  const dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  const n=Math.max(4,Math.round(W/110));
  corals=[];for(let i=0;i<n;i++){const x=rnd(0,W),y=H*rnd(.8,.98),br=[];const grow=(x,y,a,l,d)=>{const x2=x+Math.cos(a)*l,y2=y+Math.sin(a)*l;br.push([x,y,x2,y2,d]);if(d<4){grow(x2,y2,a-rnd(.25,.6),l*.75,d+1);if(Math.random()<.8)grow(x2,y2,a+rnd(.25,.6),l*.75,d+1)}};grow(x,y,-Math.PI/2+rnd(-.2,.2),rnd(26,46)*(W<500?.7:1),0);corals.push(br)}
  weeds=[];for(let i=0;i<n*1.4;i++)weeds.push({x:rnd(0,W),y:H*rnd(.78,1),h:rnd(40,110),p:rnd(0,6)});
  rocks=[];for(let i=0;i<n*.8;i++)rocks.push({x:rnd(0,W),y:H*rnd(.8,1),rx:rnd(30,80),ry:rnd(14,30)});
  fish=[];for(let i=0;i<Math.max(5,n);i++)fish.push({x:rnd(0,W),y:H*rnd(.25,.75),v:rnd(.3,.9)*(Math.random()<.5?-1:1),s:rnd(.6,1.2),p:rnd(0,6),big:i===0});
  bubs=[];for(let i=0;i<24;i++)bubs.push({x:rnd(0,W),y:rnd(0,H),r:rnd(2,6),v:rnd(.3,.9)});
  stars=[];for(let i=0;i<Math.round(W*H/6000);i++)stars.push({x:rnd(0,W),y:rnd(0,H*.82),r:rnd(.6,2),v:rnd(.4,1.4),p:rnd(0,6)});
  fish.forEach(f=>{f.pts=[];for(let k=0;k<7;k++)f.pts.push(rnd(.7,1.15))});
}
let stars=[];
function draw(t){ if(world()==='space') drawSpace(t); else drawSea(t) }
function drawSpace(t){
  const gY=H*.8, mv=reduce.matches?0:1;
  let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,col['sea-top']);gr.addColorStop(.75,col['sea-mid']);gr.addColorStop(1,col['sea-mid']);g.fillStyle=gr;g.fillRect(0,0,W,H);
  [[.25,.3,col.coral],[.75,.22,col.sage],[.55,.6,col.accent]].forEach(([x,y,c],i)=>{const cx=W*x+Math.sin(t/9000+i)*30,cy=H*y,r=Math.max(W,H)*.35;const rg=g.createRadialGradient(cx,cy,0,cx,cy,r);rg.addColorStop(0,c);rg.addColorStop(1,'transparent');g.globalAlpha=.17;g.fillStyle=rg;g.fillRect(0,0,W,H)});g.globalAlpha=1;
  g.fillStyle=col.ray;stars.forEach(s=>{g.globalAlpha=.3+.7*Math.abs(Math.sin(t/1400*s.v+s.p));g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill()});g.globalAlpha=1;
  const pr=Math.min(W,H)*.15,px=W*.1,py=H*.42;
  g.save();g.translate(px,py);g.rotate(-.25);g.strokeStyle=col.fish;g.lineWidth=Math.max(3,pr*.07);g.globalAlpha=.85;g.beginPath();g.ellipse(0,0,pr*1.65,pr*.4,0,Math.PI,2*Math.PI);g.stroke();g.restore();g.globalAlpha=1;
  g.fillStyle=col.coral;g.beginPath();g.arc(px,py,pr,0,7);g.fill();
  g.save();g.beginPath();g.arc(px,py,pr,0,7);g.clip();g.fillStyle=col.accent;g.globalAlpha=.55;g.fillRect(px-pr,py-pr*.4,pr*2,pr*.2);g.fillRect(px-pr,py+pr*.12,pr*2,pr*.14);g.globalAlpha=.22;g.fillStyle='#1E2033';g.beginPath();g.arc(px+pr*.45,py+pr*.4,pr,0,7);g.fill();g.restore();g.globalAlpha=1;
  g.save();g.translate(px,py);g.rotate(-.25);g.strokeStyle=col.fish;g.lineWidth=Math.max(3,pr*.07);g.globalAlpha=.85;g.beginPath();g.ellipse(0,0,pr*1.65,pr*.4,0,0,Math.PI);g.stroke();g.restore();g.globalAlpha=1;
  const mr=pr*.32;g.fillStyle=col.sage;g.beginPath();g.arc(W*.86,H*.6,mr,0,7);g.fill();g.fillStyle='#1E2033';g.globalAlpha=.18;g.beginPath();g.arc(W*.86+mr*.4,H*.6+mr*.3,mr,0,7);g.fill();g.globalAlpha=1;
  const ph=(t%7000)/7000;if(ph<.15&&mv){const k=ph/.15,sx=W*(.35+k*.5),sy=H*(.06+k*.22);const lg=g.createLinearGradient(sx,sy,sx-130,sy-60);lg.addColorStop(0,col.ray);lg.addColorStop(1,'transparent');g.strokeStyle=lg;g.lineWidth=2.5;g.globalAlpha=1-k;g.beginPath();g.moveTo(sx,sy);g.lineTo(sx-130,sy-60);g.stroke();g.globalAlpha=1}
  fish.forEach(f=>{f.x+=f.v*.6*mv;if(f.x<-80)f.x=W+80;if(f.x>W+80)f.x=-80;const y=f.y+Math.sin(t/1500+f.p)*8;g.save();g.translate(f.x,y);
    if(f.big){const d=f.v>0?1:-1;g.scale(d*1.6,1.6);
      g.fillStyle=col.fish;g.globalAlpha=.6+.4*Math.abs(Math.sin(t/120));g.beginPath();g.moveTo(-20,-4);g.lineTo(-32,0);g.lineTo(-20,4);g.fill();g.globalAlpha=1;
      g.fillStyle=col.coral;g.beginPath();g.moveTo(-14,-6);g.lineTo(-22,-13);g.lineTo(-8,-7);g.fill();g.beginPath();g.moveTo(-14,6);g.lineTo(-22,13);g.lineTo(-8,7);g.fill();
      g.fillStyle=col.ray;g.beginPath();g.ellipse(0,0,20,8,0,0,7);g.fill();g.beginPath();g.moveTo(18,-5);g.quadraticCurveTo(30,0,18,5);g.fill();
      g.fillStyle=col['sea-top'];g.beginPath();g.arc(5,0,3.5,0,7);g.fill()}
    else{g.rotate(t/4000*f.v+f.p);const r=8*f.s;g.fillStyle=col['sand-dk'];g.beginPath();f.pts.forEach((q,k)=>{const a=k/7*Math.PI*2;k?g.lineTo(Math.cos(a)*r*q,Math.sin(a)*r*q):g.moveTo(Math.cos(a)*r*q,Math.sin(a)*r*q)});g.fill();g.fillStyle=col['sea-mid'];g.beginPath();g.arc(r*.2,-r*.2,r*.25,0,7);g.fill()}
    g.restore()});
  g.fillStyle=col.sand;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W+20;x+=20)g.lineTo(x,gY+Math.sin(x/220)*16+Math.sin(x/70)*4);g.lineTo(W,H);g.fill();
  rocks.forEach(r=>{const cy=Math.max(r.y,gY+24);g.fillStyle=col['sand-dk'];g.beginPath();g.ellipse(r.x,cy,r.rx*.6,r.ry*.45,0,0,7);g.fill();g.strokeStyle=col.ray;g.globalAlpha=.4;g.lineWidth=2;g.beginPath();g.ellipse(r.x,cy,r.rx*.6,r.ry*.45,0,0,Math.PI);g.stroke();g.globalAlpha=1});
}
function drawSea(t){
  const sandY=H*.74;
  let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,col['sea-top']);gr.addColorStop(.62,col['sea-mid']);gr.addColorStop(1,col['sand']);g.fillStyle=gr;g.fillRect(0,0,W,H);
  // rays
  g.save();g.globalAlpha=.13;for(let i=0;i<6;i++){const x=W*(i/5)+Math.sin(t/4000+i)*40;const lg=g.createLinearGradient(0,0,0,H*.8);lg.addColorStop(0,col.ray);lg.addColorStop(1,'transparent');g.fillStyle=lg;g.beginPath();g.moveTo(x-20,0);g.lineTo(x+40,0);g.lineTo(x+150,H*.8);g.lineTo(x+60,H*.8);g.fill()}g.restore();
  // sand
  g.fillStyle=col.sand;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W+20;x+=20)g.lineTo(x,sandY+Math.sin(x/140)*14+Math.sin(x/53)*5);g.lineTo(W,H);g.fill();
  // caustics
  g.save();g.beginPath();g.rect(0,sandY-20,W,H);g.clip();g.strokeStyle=col.ray;g.globalAlpha=.28;g.lineWidth=2.5;
  for(let k=0;k<16;k++){g.beginPath();const y0=sandY+k*(H-sandY)/12;for(let x=0;x<=W;x+=14){const y=y0+Math.sin(x/38+t/1600+k)*8+Math.sin(x/17-t/2100+k*2)*4;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}
  for(let k=0;k<Math.round(W/60);k++){g.beginPath();const x0=k*60+(k%2)*30;for(let y=sandY;y<=H;y+=14){const x=x0+Math.sin(y/30+t/1800+k)*10;y===sandY?g.moveTo(x,y):g.lineTo(x,y)}g.stroke()}
  g.restore();
  // rocks & weeds
  g.fillStyle=col['sand-dk'];rocks.forEach(r=>{g.beginPath();g.ellipse(r.x,r.y,r.rx,r.ry,0,Math.PI,0);g.fill()});
  g.strokeStyle=col.sage;g.lineCap='round';weeds.forEach(w=>{g.lineWidth=5;g.beginPath();g.moveTo(w.x,w.y);const s=Math.sin(t/1400+w.p)*16;g.quadraticCurveTo(w.x+s,w.y-w.h*.5,w.x+s*1.6,w.y-w.h);g.stroke()});
  g.strokeStyle=col.coral;corals.forEach(br=>br.forEach(([a,b,c,d,dep])=>{g.lineWidth=Math.max(2.5,9-dep*1.6);g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke();if(dep>=3){g.fillStyle=col.ray;g.globalAlpha=.8;g.beginPath();g.arc(c,d,2.4,0,7);g.fill();g.globalAlpha=1}}));
  // fish
  fish.forEach(f=>{f.x+=f.v*(reduce.matches?0:1);if(f.x<-80)f.x=W+80;if(f.x>W+80)f.x=-80;const y=f.y+Math.sin(t/900+f.p)*6;const dir=f.v>0?1:-1,s=f.s*(f.big?2.6:1);
    g.save();g.translate(f.x,y);g.scale(dir*s,s);
    if(f.big){g.fillStyle=col['sea-top'];g.globalAlpha=.75;g.beginPath();g.ellipse(0,0,34,11,0,0,7);g.fill();g.beginPath();g.moveTo(-30,0);g.lineTo(-48,-10);g.lineTo(-46,10);g.fill();g.globalAlpha=1}
    else{g.fillStyle=col.fish;g.beginPath();g.ellipse(0,0,14,10,0,0,7);g.fill();g.beginPath();g.moveTo(-12,0);g.lineTo(-22,-8);g.lineTo(-22,8);g.fill();g.fillStyle=col['sea-top'];g.fillRect(-2,-9,4,18);g.fillStyle='#3B4A4E';g.beginPath();g.arc(7,-2,1.8,0,7);g.fill()}
    g.restore()});
  // bubbles
  g.strokeStyle=col.ray;g.globalAlpha=.55;g.lineWidth=1.4;bubs.forEach(b=>{if(!reduce.matches){b.y-=b.v;if(b.y<-10){b.y=H+10;b.x=rnd(0,W)}}g.beginPath();g.arc(b.x+Math.sin(t/700+b.r)*3,b.y,b.r,0,7);g.stroke()});g.globalAlpha=1;
  // surface shimmer
  g.fillStyle=col.ray;g.globalAlpha=.10;g.fillRect(0,0,W,6);g.globalAlpha=1;
}
let last=0;function loop(t){if(t-last>33){draw(t);last=t}if(!reduce.matches)requestAnimationFrame(loop)}
function start(){readCol();scene();draw(performance.now());if(!reduce.matches)requestAnimationFrame(loop)}
window.__seaRecolor=()=>{readCol();draw(performance.now())};
addEventListener('resize',()=>{scene();if(reduce.matches)draw(0)});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{readCol();if(reduce.matches)draw(0)});
new MutationObserver(()=>{readCol();if(reduce.matches)draw(0)}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
start();
})();
